<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Painel de gestão para distribuidoras de insumos: estoque, pedidos, fornecedores e financeiro.">
<meta name="theme-color" content="#0a0c10">
<title>Grão Central — Painel de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/componentes.css">
</head>
<body>

<!-- Cobre a tela enquanto a sessão salva é verificada, para não
     piscar o painel vazio antes do login. -->
<div class="boot" id="boot">
  <span class="spinner"></span>
  <span>Carregando o sistema…</span>
</div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10 L12 4 L20 10 L20 20 L4 20 Z" stroke="#e3a857" stroke-width="1.4" fill="none"/>
          <path d="M8 20 L8 13 L16 13 L16 20" stroke="#e3a857" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">GRÃO CENTRAL</span>
        <span class="brand-tag">Insumos para pizzarias</span>
      </div>
    </div>

    <div class="topbar-right">
      <div class="status-strip">
        <span class="status-dot"></span>
        <span class="status-label">Sistema operacional</span>
        <span class="clock" id="clock">--:--:--</span>
      </div>
      <div id="areaUsuario"></div>
      <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobileNav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="tabs-wrap">
    <nav class="tabs" id="tabs">
      <button class="tab tab-link active" data-tab="inicio">Início</button>
      <button class="tab tab-link" data-tab="produtos">Produtos</button>
      <button class="tab tab-link" data-tab="estoque">Estoque</button>
      <button class="tab tab-link" data-tab="pedidos">Pedidos</button>
      <button class="tab tab-link" data-tab="fornecedores">Fornecedores</button>
      <button class="tab tab-link" data-tab="transportadoras">Transportadoras</button>
      <button class="tab tab-link" data-tab="financeiro">Financeiro</button>
      <button class="tab tab-link" data-tab="agenda">Agenda</button>
      <button class="tab tab-link" data-tab="funcionarios">Funcionários</button>
      <button class="tab tab-link" data-tab="relatorios">Relatórios</button>
    </nav>
    <div class="flow-line"><span></span><span></span><span></span></div>
  </div>

  <div class="mobile-nav" id="mobileNav">
    <nav class="mobile-nav-panel">
      <div class="mobile-nav-head">
        <span class="brand-name" style="font-size:15px;">Menu</span>
        <button class="mobile-nav-close" id="mobileNavClose" aria-label="Fechar menu">✕</button>
      </div>
      <button class="mobile-tab tab-link active" data-tab="inicio">Início</button>
      <button class="mobile-tab tab-link" data-tab="produtos">Produtos</button>
      <button class="mobile-tab tab-link" data-tab="estoque">Estoque</button>
      <button class="mobile-tab tab-link" data-tab="pedidos">Pedidos</button>
      <button class="mobile-tab tab-link" data-tab="fornecedores">Fornecedores</button>
      <button class="mobile-tab tab-link" data-tab="transportadoras">Transportadoras</button>
      <button class="mobile-tab tab-link" data-tab="financeiro">Financeiro</button>
      <button class="mobile-tab tab-link" data-tab="agenda">Agenda</button>
      <button class="mobile-tab tab-link" data-tab="funcionarios">Funcionários</button>
      <button class="mobile-tab tab-link" data-tab="relatorios">Relatórios</button>
    </nav>
  </div>

  <!-- Cada seção é preenchida pelo módulo da aba, em js/views/. -->
  <main class="content">
    <section id="inicio"          class="panel active"></section>
    <section id="produtos"        class="panel"></section>
    <section id="estoque"         class="panel"></section>
    <section id="pedidos"         class="panel"></section>
    <section id="fornecedores"    class="panel"></section>
    <section id="transportadoras" class="panel"></section>
    <section id="financeiro"      class="panel"></section>
    <section id="agenda"          class="panel"></section>
    <section id="funcionarios"    class="panel"></section>
    <section id="relatorios"      class="panel"></section>
  </main>

  <footer class="credit">Grão Central · Painel de gestão — Mesquita SaaS</footer>
</div>

<script type="module" src="js/app.js"></script>

<!-- Navegador antigo, sem suporte a módulos: avisa em vez de ficar em branco. -->
<script nomodule>
  document.getElementById('boot').innerHTML =
    '<p style="max-width:340px;text-align:center;line-height:1.6;">' +
    'Este navegador é muito antigo para o sistema. Atualize o Chrome, o Edge ou o Firefox.</p>';
</script>
</body>
</html>
